      const LEVELS = { bajo:{ name:'Bajo', label:'Pregrado / Interno', desc:'Definiciones, evolución y patrones clínicos frecuentes.' }, medio:{ name:'Medio', label:'Residente en formación', desc:'Etiología, estudios dirigidos y diagnóstico diferencial.' }, alto:{ name:'Alto', label:'Residente senior', desc:'Decisiones de referencia, complicaciones y casos integradores.' } };
      const Q = [
        ['ad-b-01','bajo','Definición','¿Cuál es el tamaño a partir del cual un ganglio cervical suele considerarse aumentado en un niño?', ['Más de 0.5 cm','Más de 1 cm','Más de 2 cm','Más de 3 cm'],1,'En pediatría, los ganglios cervicales mayores de 1 cm se consideran aumentados de tamaño. En neonatos el límite es menor: 0.5 cm.','Cervical >1 cm en niños; >0.5 cm en neonatos.'],
        ['ad-b-02','bajo','Evolución','¿Qué evolución corresponde mejor a una adenopatía aguda?', ['Aparece en días y desaparece en 3-4 semanas','Persiste 3-6 semanas','Dura más de 6 semanas','Siempre progresa a absceso'],0,'Las adenopatías agudas aparecen en pocos días, disminuyen antes de dos semanas y suelen desaparecer en 3 a 4 semanas. La duración de 3 a 6 semanas define una evolución subaguda y más de 6 semanas una crónica.','Aguda: días de inicio y resolución habitual antes de 4 semanas.'],
        ['ad-b-03','bajo','Patrón viral','En un niño con rinorrea y faringitis, ¿qué patrón ganglionar orienta más a una causa viral reactiva?', ['Unilateral, doloroso y con eritema','Bilateral, pequeño, móvil y sin supuración','Supraclavicular, duro y fijo','Cervical crónico con piel violácea'],1,'Las infecciones virales de vías respiratorias superiores causan con frecuencia adenopatías bilaterales, pequeñas, móviles, bien delimitadas y con escasa inflamación. Los otros patrones requieren una valoración diferente.','Bilateral + móvil + síntomas respiratorios suele ser reactivo/viral.'],
        ['ad-b-04','bajo','Patrón bacteriano','¿Cuál es un agente frecuente de adenitis cervical bacteriana aguda unilateral?', ['Staphylococcus aureus','Rinovirus','Virus de Epstein-Barr','Toxoplasma gondii'],0,'La adenitis bacteriana cervical aguda suele asociarse a Staphylococcus aureus, Streptococcus pyogenes o anaerobios vinculados con patología periodontal. Los virus suelen causar adenopatías reactivas bilaterales.','S. aureus y S. pyogenes son objetivos iniciales frecuentes.'],
        ['ad-b-05','bajo','Localización','¿Qué localización ganglionar obliga a aumentar la sospecha de malignidad?', ['Occipital','Submandibular','Supraclavicular','Preauricular'],2,'La adenopatía supraclavicular constituye un dato de alarma y exige una evaluación cuidadosa. También puede asociarse a tuberculosis o infecciones granulomatosas.','La localización supraclavicular es una bandera roja.'],
        ['ad-b-06','bajo','Clasificación','¿Cuándo se considera que existen adenopatías generalizadas?', ['Cuando son mayores de 2 cm','Cuando hay ganglios en dos o más regiones no contiguas','Cuando duran más de 6 semanas','Cuando son cervicales bilaterales'],1,'Las adenopatías generalizadas afectan dos o más regiones no contiguas y orientan hacia una enfermedad sistémica. El tamaño y la duración por sí solos no las definen.','Generalizada = dos o más regiones no contiguas.'],
        ['ad-m-01','medio','Etiología crónica','Niño de 3 años con ganglio cervical unilateral indoloro, progresivo, piel violácea y posible fistulización. ¿Qué etiología es más compatible?', ['Adenitis viral','Micobacterias no tuberculosas','Adenitis bacteriana aguda','Faringitis estreptocócica'],1,'Las micobacterias no tuberculosas suelen afectar a menores de 5 años con ganglios firmes, indoloros y progresivos. Pueden producir piel violácea y fistulización.','MNT: curso crónico, unilateral, indoloro y piel violácea.'],
        ['ad-m-02','medio','Imagen','¿Cuál es el estudio de imagen más útil para valorar un posible absceso en adenitis cervical?', ['Tomografía de rutina','Ecografía ganglionar','Resonancia en todos los casos','Radiografía de mano'],1,'La ecografía ganglionar ayuda a identificar absceso y orientar la necesidad de drenaje. Los estudios se seleccionan según la sospecha, evitando pruebas innecesarias en adenopatías claramente reactivas.','La ecografía orienta ante sospecha de absceso.'],
        ['ad-m-03','medio','Antibiótico','En adenitis bacteriana aguda ambulatoria, el tratamiento inicial debe cubrir principalmente:', ['EBV y CMV','S. aureus y S. pyogenes','Micobacterias y hongos','VIH y toxoplasma'],1,'La cobertura empírica se orienta contra S. aureus y S. pyogenes. La presentación menciona cefadroxilo como primera opción ambulatoria y cloxacilina o clindamicina como alternativas, según contexto clínico.','La terapia empírica debe cubrir S. aureus y S. pyogenes.'],
        ['ad-m-04','medio','Historia clínica','¿Qué antecedente apoya de forma más directa la sospecha de enfermedad por arañazo de gato?', ['Vacunación reciente','Contacto con gato','Consumo de leche no pasteurizada','Uso de antibióticos'],1,'Bartonella henselae causa la enfermedad por arañazo de gato y representa una causa frecuente de adenopatía regional subaguda. La historia debe preguntar por contacto con animales.','El contacto con gato es una pista para Bartonella henselae.'],
        ['ad-m-05','medio','Estudios','En una adenopatía claramente reactiva asociada a una infección viral de vías respiratorias, ¿cuál es la conducta más apropiada?', ['Solicitar biopsia inmediata','Solicitar serologías completas siempre','Observación clínica y evitar pruebas innecesarias','Iniciar cuatro fármacos antituberculosos'],2,'Las pruebas complementarias se solicitan según la sospecha clínica. Cuando el patrón es claramente reactivo, la observación y el manejo sintomático evitan estudios innecesarios.','La clínica guía la necesidad de estudios.'],
        ['ad-m-06','medio','Exploración','¿Cuál combinación describe mejor un ganglio con características generalmente benignas?', ['Duro, fijo y progresivo','Pequeño, blando, móvil y bien delimitado','Supraclavicular e indoloro','Generalizado con pérdida de peso'],1,'Los ganglios benignos suelen ser pequeños, blandos, móviles y bien delimitados. La fijación, dureza, crecimiento progresivo y los síntomas constitucionales obligan a ampliar el estudio.','Móvil y blando suele tranquilizar; el contexto siempre importa.'],
        ['ad-a-01','alto','Referencia','Tras 72 horas de tratamiento empírico para adenitis bacteriana no hay mejoría. ¿Qué paso es más apropiado?', ['Continuar igual sin reevaluar','Reevaluar y considerar referencia, estudios o drenaje según hallazgos','Suspender todo tratamiento y esperar seis meses','Asumir que es viral sin examen'],1,'La ausencia de mejoría tras 48 a 72 horas es un criterio para reevaluación y posible derivación. Deben buscarse absceso, diagnóstico alternativo o necesidad de tratamiento dirigido.','Fallo en 48-72 h requiere reevaluación clínica.'],
        ['ad-a-02','alto','Tratamiento','¿Cuál es el tratamiento de elección descrito para adenitis por micobacterias no tuberculosas cervicales?', ['Incisión y drenaje aislado','Exéresis completa cuando está indicada','Antiviral de amplio espectro','Observación en todos los casos'],1,'La exéresis completa se considera de elección en los casos adecuados. El drenaje o la exéresis incompleta pueden favorecer la fistulización. Algunos casos requieren manejo antimicrobiano combinado.','En MNT cervical, evitar drenajes incompletos que favorecen fistulización.'],
        ['ad-a-03','alto','Tuberculosis','Según el material, ¿cuál esquema se inicia mientras se conoce la sensibilidad en tuberculosis ganglionar?', ['Isoniacida y rifampicina solamente','Cuatro fármacos: isoniacida, etambutol, rifampicina y pirazinamida','Cefadroxilo y clindamicina','Corticoide como monoterapia'],1,'El material describe un inicio con isoniacida, etambutol, rifampicina y pirazinamida hasta conocer sensibilidad, seguido por isoniacida y rifampicina. La conducta final debe individualizarse según protocolos y especialista.','TB ganglionar: inicio con cuatro fármacos según protocolo.'],
        ['ad-a-04','alto','Alarma','¿Qué hallazgo adicional eleva más la preocupación ante una adenopatía persistente?', ['Dolor al palpar durante faringitis','Ganglio duro, fijo a planos profundos y pérdida de peso','Rinorrea de dos días','Vacunación reciente aislada'],1,'Persistencia, progresión, dureza, fijación, localización supraclavicular, síntomas constitucionales, hepatoesplenomegalia o alteraciones hematológicas son datos de alarma.','Persistente + dura/fija + síntomas constitucionales exige estudio.'],
        ['ad-a-05','alto','Diagnóstico diferencial','Niño con adenopatía cervical, fiebre prolongada, conjuntivitis, exantema y cambios mucosos. ¿Qué entidad debe considerarse?', ['Enfermedad de Kawasaki','Adenitis viral simple','Tiña del cuero cabelludo','Adenitis mesentérica'],0,'La combinación de adenopatía con fiebre prolongada, conjuntivitis, exantema y cambios mucosos orienta a considerar enfermedad de Kawasaki. Requiere valoración clínica urgente.','Adenopatía + fiebre prolongada + mucosas/conjuntivitis: considerar Kawasaki.'],
        ['ad-a-06','alto','Decisión clínica','¿Qué escenario justifica con mayor claridad ampliar el estudio por posible enfermedad sistémica?', ['Ganglio bilateral pequeño durante resfriado','Adenopatías en regiones no contiguas sin causa evidente','Adenopatía submandibular dolorosa tras caries','Ganglio occipital con dermatitis del cuero cabelludo'],1,'Las adenopatías generalizadas sin causa evidente deben hacer pensar en enfermedad sistémica y motivan una valoración dirigida. Los otros escenarios tienen una puerta de entrada local más probable.','Adenopatías generalizadas requieren una mirada sistémica.']
      ].map(([id,difficulty,subtema,pregunta,opciones,correcta,explicacion,datoClave]) => ({id,tema:'adenopatias',difficulty,subtema,pregunta,opciones,correcta,explicacion,datoClave}));
      const SOURCE_BANK = window.QUESTION_BANK || [];
      const STUDY_BANK = SOURCE_BANK.length ? SOURCE_BANK : Q;
      const questionsFor = (topic, level) => STUDY_BANK.filter(q => q.tema === topic && q.difficulty === level);
      const VISUAL_META = {
        atresia_esofagica:{label:'Aire y alimento', child:'Piensa en dos pajillas que deben ir por caminos diferentes: una lleva aire y la otra alimento.', svg:`<path d="M60 18v52M60 70l-25 33M60 70l25 33" fill="none" stroke="#2b2f63" stroke-width="12" stroke-linecap="round"/><path d="M110 18v88" fill="none" stroke="#e8663e" stroke-width="12" stroke-linecap="round"/><path d="M69 58l33 16" fill="none" stroke="#dca53b" stroke-width="8" stroke-linecap="round"/><text x="17" y="130" font-size="11" fill="#2b2f63">vía aérea</text><text x="92" y="130" font-size="11" fill="#a8492f">esófago</text>`},
        atresia_intestinal:{label:'El tubo intestinal', child:'El intestino se parece a una manguera. Si algo la tapa, lo que va antes se llena y lo que va después recibe poco.', svg:`<path d="M20 48c28-35 54 35 82 0s54 35 82 0" fill="none" stroke="#d69730" stroke-width="15" stroke-linecap="round"/><circle cx="102" cy="48" r="18" fill="#fff0e8" stroke="#c1502f" stroke-width="7"/><path d="M95 41l14 14M109 41L95 55" stroke="#c1502f" stroke-width="5" stroke-linecap="round"/><text x="23" y="103" font-size="11" fill="#8a6a1f">paso</text><text x="113" y="103" font-size="11" fill="#a8492f">obstrucción</text>`},
        fisiologia_pulmonar:{label:'Oxígeno en movimiento', child:'Los alvéolos son como globitos minúsculos. El oxígeno salta de ellos a la sangre para viajar por el cuerpo.', svg:`<circle cx="58" cy="58" r="36" fill="#dce4fa" stroke="#2b2f63" stroke-width="6"/><circle cx="45" cy="48" r="7" fill="#fff"/><circle cx="66" cy="69" r="8" fill="#fff"/><path d="M104 33v54" stroke="#c1502f" stroke-width="18" stroke-linecap="round"/><path d="M78 58h17" stroke="#278a70" stroke-width="7" stroke-linecap="round"/><path d="M88 48l12 10-12 10" fill="none" stroke="#278a70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="118" font-size="11" fill="#2b2f63">alvéolo</text><text x="93" y="118" font-size="11" fill="#a8492f">sangre</text>`},

        adenopatias:{label:'Ganglios como filtros', child:'Los ganglios son pequeños filtros. Se inflaman cuando están trabajando, pero algunas pistas dicen que hay que mirarlos con más cuidado.', svg:`<path d="M86 15c-20 18-25 38-23 62 2 27-8 43-24 54" fill="none" stroke="#c9a892" stroke-width="18" stroke-linecap="round"/><circle cx="69" cy="44" r="12" fill="#d9f0e9" stroke="#197866" stroke-width="5"/><circle cx="76" cy="72" r="12" fill="#d9f0e9" stroke="#197866" stroke-width="5"/><circle cx="53" cy="95" r="12" fill="#fff0e8" stroke="#e8663e" stroke-width="5"/><text x="25" y="130" font-size="11" fill="#197866">ganglio</text><text x="89" y="130" font-size="11" fill="#a8492f">pista</text>`}
      };
      function hash(value){ return [...value].reduce((n,ch)=>(n*31+ch.charCodeAt(0))>>>0,7); }
      function words(value){ return new Set((value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z0-9]{4,}/g)||[]); }
      function similarity(a,b){ const A=words(a),B=words(b); let common=0;A.forEach(x=>{if(B.has(x))common++});return common/(Math.sqrt(A.size*B.size)||1); }
      function optionsFor(question){ const pool=questionsFor(question.tema,question.difficulty).filter(q=>q.id!==question.id&&q.respuesta!==question.respuesta); const ranked=pool.map(q=>({q,score:similarity(question.pregunta+' '+question.respuesta,q.pregunta+' '+q.respuesta)+(hash(question.id+q.id)%100)/10000})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.q.respuesta); const choices=[question.respuesta,...ranked]; const correct=hash(question.id)%choices.length; choices.splice(correct,0,choices.shift()); return {opciones:choices,correcta:correct}; }
      function materialize(question){ return question.opciones ? question : {...question,...optionsFor(question)}; }
      function short(value,max=96){ return value.length>max?value.slice(0,max-1)+'…':value; }
      function explanationFor(question, mode, selected){ const meta=VISUAL_META[question.tema], cue=short(question.pregunta.replace(/^¿|\?$/g,''),130), answer=question.respuesta; if(mode==='child') return `${meta.child} En esta pregunta, la pista importante es “${cue}”. Por eso la respuesta es: ${answer}`; if(mode==='curious') return `Busca primero la pista del caso o la definición. Aquí, “${cue}” se relaciona con “${answer}”. Conecta el dato principal con el mecanismo, la clasificación o la conducta que plantea la pregunta.`; if(mode==='professional') return `Clave del banco clínico: ${answer}. Esta respuesta corresponde al dato preguntado y debe interpretarse dentro del contexto clínico, la edad, los hallazgos asociados y las guías institucionales vigentes.`; if(selected!==question.correcta) return `La opción elegida puede ser correcta en otra pregunta del mismo tema, pero no responde a esta pista. La clave validada para este reactivo es: ${answer}`; return `Correcta. La clave validada del banco es: ${answer}. Coincide con el dato específico que pregunta el reactivo.`; }
      function visualFor(question){ const meta=VISUAL_META[question.tema], topic=TOPICS.find(t=>t.id===question.tema); return `<section class="visual-card"><svg viewBox="0 0 160 145" role="img" aria-label="Ilustración clínica de ${esc(meta.label)}"><rect x="1" y="1" width="158" height="143" rx="17" fill="${topic.soft}"/>${meta.svg}</svg><div><span class="eyebrow">Visualiza la idea</span><h3>${meta.label}</h3><p>La pista de la pregunta dirige la atención hacia <b>${esc(short(question.respuesta,110))}</b>. Ese es el dato que hace correcta la alternativa marcada.</p></div></section>`; }
      const BADGES = [
        ['primeros_pasos','Primeros pasos','Completa tu primer cuestionario','🥉',p=>p.stats.quizzes>=1],['estudiante_dedicado','Estudiante dedicado','Completa 5 cuestionarios','📚',p=>p.stats.quizzes>=5],['interno_ejemplar','Interno ejemplar','Completa 20 cuestionarios','🩺',p=>p.stats.quizzes>=20],['cien_preguntas','100 preguntas','Responde 100 preguntas','📖',p=>p.stats.answers>=100],['250_preguntas','250 preguntas','Responde 250 preguntas','📘',p=>p.stats.answers>=250],['banco_completo','Banco completo','Responde 450 preguntas','🗂️',p=>p.stats.answers>=450],['puntaje_perfecto','Puntaje perfecto','Obtén 100% en un nivel','🎯',p=>p.stats.perfect>0],['especialista_alto','Especialista alto nivel','Obtén 100% en nivel alto','🌟',p=>p.stats.perfectHigh>0],['racha_10','Racha de aciertos ×10','Logra 10 aciertos seguidos','🔥',p=>p.stats.bestCorrectStreak>=10],['racha_20','Racha de aciertos ×20','Logra 20 aciertos seguidos','💥',p=>p.stats.bestCorrectStreak>=20],['racha_3','Racha de 3 días','Estudia tres días seguidos','📅',p=>p.streak.best>=3],['racha_7','Racha de 7 días','Estudia una semana seguida','🗓️',p=>p.streak.best>=7],['racha_14','Racha de 14 días','Estudia dos semanas seguidas','🏅',p=>p.streak.best>=14],['racha_30','Racha de 30 días','Estudia un mes seguido','💎',p=>p.streak.best>=30],['maestro_eso','Maestro de atresia esofágica','Logra 80% en sus tres niveles','🏆',p=>['bajo','medio','alto'].every(l=>(p.scores['atresia_esofagica|'+l]||0)>=80)],['maestro_int','Maestro de atresia intestinal','Logra 80% en sus tres niveles','🏆',p=>['bajo','medio','alto'].every(l=>(p.scores['atresia_intestinal|'+l]||0)>=80)],['maestro_pul','Maestro de fisiología pulmonar','Logra 80% en sus tres niveles','🏆',p=>['bajo','medio','alto'].every(l=>(p.scores['fisiologia_pulmonar|'+l]||0)>=80)],['maestro_car','Maestro de cardiopatías','Logra 80% en sus tres niveles','🏆',p=>['bajo','medio','alto'].every(l=>(p.scores['cardiopatias|'+l]||0)>=80)],['maestro_adeno','Maestro de adenopatías','Logra 80% en sus tres niveles','🏆',p=>['bajo','medio','alto'].every(l=>(p.scores['adenopatias|'+l]||0)>=80)],['residente_integral','Residente integral','Completa un nivel de cada tema','🌐',p=>TOPICS.every(t=>Object.keys(p.scores).some(k=>k.startsWith(t.id+'|')))],['gran_maestro','Gran maestro pediátrico','Domina los 15 niveles con 80%','👑',p=>TOPICS.every(t=>['bajo','medio','alto'].every(l=>(p.scores[t.id+'|'+l]||0)>=80))],['reflejos','Reflejos clínicos','Completa Memorama Clínico','🧠',p=>p.stats.memory>0],['rafaga','Modo ráfaga superado','Completa Modo Ráfaga','⚡',p=>p.stats.sprint>0]

      const AVATARS = ['🧑🏽‍⚕️','👩🏽‍⚕️','🧑🏻‍⚕️','👨🏾‍⚕️','🩺','🐼','🦊','🐻'];

      function normalizeProfile(p){ if(!p)return null; p.stats={quizzes:0,answers:0,perfect:0,perfectHigh:0,memory:0,sprint:0,bestCorrectStreak:0,...(p.stats||{})};p.streak={current:0,best:0,last:null,...(p.streak||{})};p.scores=p.scores||{};p.history=p.history||[];p.card={bio:'',photoUrl:'',friendCode:'',...(p.card||{})};return p; }
      function load(){ try { return normalizeProfile(JSON.parse(localStorage.getItem(STORE)) || null); } catch { return null; } }
      function save(p){ localStorage.setItem(STORE, JSON.stringify(p)); if(p.cloud?.userId) scheduleCloudSync(p); }
      function today(){ return new Date().toISOString().slice(0,10); }
      function profile(){ return load(); }
      function defaultProfile(name, avatar){ return { name, avatar, createdAt:Date.now(), xp:0, stats:{quizzes:0,answers:0,perfect:0,perfectHigh:0,memory:0,sprint:0,bestCorrectStreak:0}, streak:{current:0,best:0,last:null}, scores:{}, history:[], card:{bio:'',photoUrl:'',friendCode:''} }; }
      function touchStudy(p){ const now=today(); if(p.streak.last===now) return; const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10); p.streak.current=p.streak.last===yesterday?p.streak.current+1:1; p.streak.best=Math.max(p.streak.best,p.streak.current); p.streak.last=now; }
      function cloudClient(){ const c=window.SUPABASE_CONFIG||{}; if(!c.url||!c.publishableKey||!window.supabase?.createClient)return null; return window.__residenciaSupabase||(window.__residenciaSupabase=window.supabase.createClient(c.url,c.publishableKey)); }
      function cloudPayload(p){ const {cloud,...progress}=p;return progress; }
      let cloudSyncTimer;
      function scheduleCloudSync(p){ clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>syncCloud(p),700); }
      async function syncCloud(p){ const client=cloudClient();if(!client||!p.cloud?.userId)return;try{const {data:{user}}=await client.auth.getUser();if(!user||user.id!==p.cloud.userId)return;await client.rpc('sync_profile_progress',{p_display_name:p.name,p_avatar:p.avatar,p_progress:cloudPayload(p)});}catch{} }
      async function profileFromCloud(client,user,fallback){ const {data,error}=await client.from('profiles').select('display_name,avatar,progress,role,is_active').eq('id',user.id).maybeSingle();if(error)throw error;if(data&&!data.is_active){await client.auth.signOut();throw new Error('Tu cuenta está dada de baja. Contacta al administrador.');}let socialData=null;try{const {data:extra}=await client.from('profiles').select('friend_code,bio,photo_url').eq('id',user.id).maybeSingle();socialData=extra;}catch{}const remote=normalizeProfile(data?.progress)||fallback;const name=data?.display_name||user.user_metadata?.display_name||fallback.name;const avatar=data?.avatar||fallback.avatar;const p=normalizeProfile({...defaultProfile(name,avatar),...remote,name,avatar,card:{...(remote.card||{}),bio:socialData?.bio||remote.card?.bio||'',photoUrl:socialData?.photo_url||remote.card?.photoUrl||'',friendCode:socialData?.friend_code||remote.card?.friendCode||''},cloud:{userId:user.id,email:user.email,role:data?.role||'student'}});if(!data){const {error:insertError}=await client.rpc('bootstrap_profile',{p_display_name:name,p_avatar:avatar,p_progress:cloudPayload(p)});if(insertError)throw insertError;}return p; }
      async function authenticate(kind){ const name=$('#authName')?.value.trim(),email=$('#authEmail')?.value.trim(),password=$('#authPassword')?.value||'',avatar=$('[data-avatar].selected')?.dataset.avatar||AVATARS[0],status=$('#authStatus'),client=cloudClient();if(!client){status.textContent='El inicio de sesión se activará cuando conectes este sitio con Supabase.';return;}status.textContent='Conectando…';try{let data,error;if(kind==='register'){if((name||'').length<2)throw new Error('Escribe un nombre de al menos 2 caracteres.');({data,error}=await client.auth.signUp({email,password,options:{data:{display_name:name}}}));if(error)throw error;if(!data.user)throw new Error('No fue posible crear la cuenta.');if(!data.session){status.textContent='Revisa tu correo y confirma la cuenta. Luego inicia sesión.';return;}}else{({data,error}=await client.auth.signInWithPassword({email,password}));if(error)throw error;if(!data.user)throw new Error('No fue posible iniciar sesión.');}const p=await profileFromCloud(client,data.user,defaultProfile(name||data.user.user_metadata?.display_name||'Residente',avatar));save(p);render();}catch(error){status.textContent=error.message||'No fue posible completar la solicitud.';} }

      function onboarding(){ return `<main class="onboard"><section class="onboard-card"><span class="eyebrow">Libre, local y para aprender</span><h1>Tu residencia, un tema a la vez</h1><p>Practica casos y preguntas clínicas. Tu progreso se guarda solo en este dispositivo, sin crear una cuenta.</p><label class="field">¿Cómo quieres que te llamemos?<input id="nameInput" maxlength="30" placeholder="Ej. Dra. Sofía"></label><strong>Elige un avatar</strong><div class="avatars">${AVATARS.map((a,i)=>`<button class="avatar-choice ${i===0?'selected':''}" data-avatar="${a}">${a}</button>`).join('')}</div><button class="btn primary" id="startBtn" style="width:100%;margin-top:24px">Crear mi perfil local</button><p class="disclaimer">Material educativo. No sustituye guías clínicas vigentes, juicio profesional ni la valoración de cada paciente.</p></section></main>`; }
      function onboarding(){ const register=state.authMode!=='login';const avatars=AVATARS.map((a,i)=>'<button class="avatar-choice '+(i===0?'selected':'')+'" data-avatar="'+a+'">'+a+'</button>').join('');const identity=register?'<label class="field">Nombre visible<input id="authName" maxlength="60" placeholder="Ej. Dra. Sofía"></label>':'';return '<main class="onboard"><section class="onboard-card"><span class="eyebrow">Residencia Pediátrica · libre para estudiar</span><h1>Tu conocimiento, sincronizado si lo deseas</h1><p>Crea una cuenta gratis para guardar tu progreso, rachas y medallas entre dispositivos. También puedes estudiar como invitado.</p><div class="auth-tabs"><button class="'+(register?'active':'')+'" data-auth-tab="register">Crear cuenta</button><button class="'+(!register?'active':'')+'" data-auth-tab="login">Iniciar sesión</button></div>'+identity+'<label class="field">Correo electrónico<input id="authEmail" type="email" autocomplete="email" placeholder="tu@correo.com"></label><label class="field">Contraseña<input id="authPassword" type="password" autocomplete="'+(register?'new-password':'current-password')+'" minlength="8" placeholder="Mínimo 8 caracteres"></label>'+(!register?'':'<strong>Elige un avatar</strong><div class="avatars">'+avatars+'</div>')+'<button class="btn primary" id="authSubmit" style="width:100%;margin-top:22px">'+(register?'Crear cuenta gratis':'Entrar a mi cuenta')+'</button><p id="authStatus" class="auth-status"></p><div class="or">o</div><button class="btn ghost" id="guestBtn" style="width:100%">Continuar como invitado</button><p class="disclaimer">El estudio permanece gratuito. Material educativo, no sustituye guías vigentes ni la valoración de cada paciente.</p></section></main>'; }

      function homePage(){ const p=profile(), active=TOPICS.find(t=>t.id==='adenopatias'); return `<section class="hero"><span class="eyebrow">Hola, ${esc(p.name)}</span><h1>Convierte el estudio diario en progreso clínico.</h1><p>Banco integrado de 450 reactivos con respuesta guiada, metas visibles y progreso local en tu dispositivo.</p><div class="hero-actions"><button class="btn primary" data-topic="${active.id}">Estudiar adenopatías</button><button class="btn light" data-go="games">Abrir juegos de repaso</button></div></section><section class="grid stats"><article class="stat"><strong>${p.streak.current} 🔥</strong><span>racha actual</span></article><article class="stat"><strong>${p.xp} XP</strong><span>experiencia acumulada</span></article><article class="stat"><strong>${p.stats.quizzes}</strong><span>cuestionarios completados</span></article><article class="stat"><strong>${Object.values(p.scores).length}/15</strong><span>niveles con puntaje</span></article></section><div class="section-head"><div><h2>Tu biblioteca clínica</h2><p>Los cinco módulos ya cuentan con 90 reactivos cada uno, organizados en tres niveles de dificultad.</p></div><button class="btn ghost desktop-nav" data-go="topics">Ver todos los temas</button></div><section class="grid topics">${topicCards()}</section><section class="layout"><div class="panel"><h3>Tu avance en adenopatías cervicales</h3><div class="progress-list">${['bajo','medio','alto'].map(l=>`<div class="progress-row"><span>${LEVELS[l].name}</span><div class="bar"><i style="width:${p.scores['adenopatias|'+l]||0}%"></i></div><b>${p.scores['adenopatias|'+l]||0}%</b></div>`).join('')}</div></div><aside class="panel"><h3>Atajo de estudio</h3><p style="margin:8px 0 16px;color:var(--muted)">Lee la pregunta, piensa la respuesta y revela la clave. Autoevalúate con honestidad para recibir recomendaciones útiles.</p><div class="notice">Este modo conserva la redacción y la respuesta validada del banco, sin inventar opciones distractoras.</div></       function boardMarkup(p){ const next=nextStep(p);const days=['L','M','M','J','V','S','D'];const studied=new Set((p.history||[]).map(h=>h.date));const week=days.map((d,i)=>'<span class="day"><i class="'+(studied.has(dayKey(i-6))?'active':'')+'"></i>'+d+'</span>').join('');const mastery=TOPICS.map(t=>{const values=Object.keys(LEVELS).map(l=>p.scores[t.id+'|'+l]||0);const pct=Math.round(values.reduce((a,b)=>a+b,0)/values.length);return '<div class="mastery-row"><span>'+t.short+'</span><strong>'+pct+'%</strong><div class="bar"><i style="width:'+pct+'%;background:'+t.accent+'"></i></div></div>';}).join('');return '<section class="learning-board"><article class="board-card route-card"><span class="eyebrow">Tu siguiente paso</span><h2>'+next.t.short+' · '+LEVELS[next.level].name+'</h2><p>Tu mejor puntaje actual es '+next.score+'%. Una ronda enfocada aquí fortalece la ruta hacia el dominio global.</p><button class="btn" data-board-topic="'+next.t.id+'" data-board-level="'+next.level+'">Continuar mi ruta</button></article><article class="board-card"><span class="eyebrow">Pulso de 7 días</span><h3>La constancia crea memoria clínica</h3><p>'+p.streak.current+' día'+(p.streak.current===1?'':'s')+' de racha actual · récord de '+p.streak.best+'.</p><div class="week">'+week+'</div></article><article class="board-card"><span class="eyebrow">Mapa de dominio</span><h3>Progreso por módulo</h3><div class="mastery">'+mastery+'</div></article><article class="board-card"><span class="eyebrow">Logros</span><h3>'+BADGES.filter(b=>b[4](p)).length+' de '+BADGES.length+' medallas</h3><p>Completa niveles, cuida tu racha y usa los modos de repaso para desbloquear nuevas insignias.</p><button class="btn ghost" data-go="achievements">Ver tablero de badges</button></article></section>'; }
      function homePage(){ const p=profile(),active=TOPICS.find(t=>t.id==='adenopatias');return '<section class="hero"><span class="eyebrow">Hola, '+esc(p.name)+(p.cloud?' · progreso sincronizado':' · modo invitado')+'</span><h1>Una ruta clínica clara. Un hábito que se nota.</h1><p>450 reactivos de opción múltiple, explicaciones graduadas y visuales que convierten cada respuesta en una conexión útil.</p><div class="hero-actions"><button class="btn primary" data-topic="'+active.id+'">Estudiar adenopatías</button><button class="btn light" data-go="topics">Explorar mi ruta</button></div></section><section class="grid stats"><article class="stat"><strong>'+p.streak.current+' 🔥</strong><span>racha actual</span></article><article class="stat"><strong>'+p.xp+' XP</strong><span>experiencia acumulada</span></article><article class="stat"><strong>'+p.stats.quizzes+'</strong><span>cuestionarios completados</span></article><article class="stat"><strong>'+Object.values(p.scores).length+'/15</strong><span>niveles con puntaje</span></article></section>'+boardMarkup(p)+'<div class="section-head"><div><h2>Tu biblioteca clínica</h2><p>Cinco módulos, 90 reactivos por tema y una experiencia diseñada para volver cada día.</p></div><button class="btn ghost desktop-nav" data-go="topics">Ver todos los temas</button></div><section class="grid topics">'+topicCards()+'</section>'; }
      function startQuiz(level){ const questions=questionsFor(state.topic,level).sort(()=>Math.random()-.5).map(materialize); state={...state,page:'quiz',level,quiz:{questions,index:0,answers:[],streak:0,bestStreak:0,revealed:false,learn:'clave'}}; render(); }
      function quizPage(){ const qz=state.quiz, q=qz.questions[qz.index], n=qz.index+1, selected=qz.answers[qz.index], learned=qz.learn||'clave'; const options=`<div class="options">${q.opciones.map((o,i)=>{ let cls=''; if(qz.revealed&&i===q.correcta)cls='correct'; if(qz.revealed&&selected===i&&i!==q.correcta)cls='incorrect'; return `<button class="option ${cls}" data-answer="${i}" ${qz.revealed?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`}).join('')}</div>`; const feedback=qz.revealed?`<section class="feedback"><strong>${selected===q.correcta?'✓ Respuesta correcta':'Respuesta correcta'}</strong><p class="learning-copy">${esc(explanationFor(q,'clave',selected))}</p>${selected!==q.correcta?`<p class="choice-note">La opción elegida pertenece al banco, pero no resuelve la pista de este reactivo.</p>`:''}<div class="learn-switch"><button class="${learned==='clave'?'active':''}" data-learning="clave">Idea clave</button><button class="${learned==='child'?'active':''}" data-learning="child">Como a los 10</button><button class="${learned==='curious'?'active':''}" data-learning="curious">Modo curioso</button><button class="${learned==='professional'?'active':''}" data-learning="professional">Modo profesional</button></div>${learned!=='clave'?`<p class="learning-copy">${esc(explanationFor(q,learned,selected))}</p>`:''}${visualFor(q)}<p class="source-note">Fuente: ${esc(TOPICS.find(t=>t.id===q.tema).source)}. Material educativo, no protocolo individual de atención.</p></section><div class="next-line"><button class="btn primary" id="nextQuestion">${n===qz.questions.length?'Ver resultados':'Siguiente pregunta'}</button></div>`:''; return `<section class="quiz-wrap"><div class="quiz-top"><span class="tag">${TOPICS.find(t=>t.id===state.topic).short} · ${LEVELS[state.level].name}</span><b>Racha ${qz.streak} 🔥</b><b>${n}/${qz.questions.length}</b></div><div class="quiz-progress"><i style="width:${(n-1)/qz.questions.length*100}%"></i></div><article class="question"><span class="eyebrow">${q.subtema}</span><h2>${esc(q.pregunta)}</h2>${options}${feedback}</article></section>`; }
      function answer(i){ const qz=state.quiz, q=qz.questions[qz.index]; if(qz.revealed)return; qz.answers[qz.index]=i; qz.revealed=true; if(i===q.correcta){qz.streak++;qz.bestStreak=Math.max(qz.bestStreak,qz.streak)} else qz.streak=0; render(); }

      function finishQuiz(){ if(state.duel&&window.finishSocialDuel)return window.finishSocialDuel();const p=profile(),qz=state.quiz, correct=qz.questions.reduce((a,q,i)=>a+(q.correcta===qz.answers[i]),0),pct=Math.round(correct/qz.questions.length*100),key=state.topic+'|'+state.level; p.stats.quizzes++;p.stats.answers+=qz.questions.length;p.stats.bestCorrectStreak=Math.max(p.stats.bestCorrectStreak||0,qz.bestStreak);p.xp+=correct*10+(pct===100?50:0);if(pct===100){p.stats.perfect++;if(state.level==='alto')p.stats.perfectHigh++;}p.scores[key]=Math.max(p.scores[key]||0,pct);touchStudy(p);p.history.unshift({date:today(),topic:state.topic,level:state.level,pct});save(p);state.latestCard=null;if(p.cloud?.userId&&window.awardFerchyCard)window.awardFerchyCard(state.topic,state.level);state={...state,page:'result',result:{correct,pct,bestStreak:qz.bestStreak,questions:qz.questions,answers:qz.answers}};render(); }
      function resultPage(){ const r=state.result, mistakes={},card=state.latestCard;r.questions.forEach((q,i)=>{if(q.correcta!==r.answers[i])mistakes[q.subtema]=(mistakes[q.subtema]||0)+1});const weak=Object.entries(mistakes).sort((a,b)=>b[1]-a[1]); return `<section class="result"><span class="eyebrow">Cuestionario completado</span><h1>${r.pct>=80?'Muy buen progreso clínico':'Sigue construyendo tu base'}</h1><div class="result-score">${r.pct}%</div><p>${r.correct} de ${r.questions.length} respuestas correctas · mejor racha ${r.bestStreak}</p>${card?`<section class="panel" style="margin-top:18px"><span class="eyebrow">Ferchy Card desbloqueada</span><h3 style="margin-top:6px">${esc(card.emoji)} ${esc(card.title)}</h3><p style="margin-top:5px;color:var(--muted)">${esc(card.message)} · ${card.rarity==='rare'?'Rara dorada':'Nueva para tu álbum'}</p><button class="btn ghost" data-go="social" style="margin-top:12px">Abrir álbum</button></section>`:''}<section class="panel recommendations"><h3>Recomendación de estudio</h3>${weak.length?`<p style="color:var(--muted);margin-top:7px">Antes de repetir el nivel, repasa:</p><ul>${weak.map(([s,n])=>`<li><b>${s}</b> · ${n} reactivo${n>1?'s':''} por reforzar</li>`).join('')}</ul>`:`<p style="color:var(--success);margin-top:7px">Dominaste este set. Prueba el siguiente nivel o un juego de repaso.</p>`}</section><div class="result-actions"><button class="btn primary" data-retry="1">Reintentar nivel</button><button class="btn ghost" data-go="levels">Cambiar nivel</button><button class="btn ghost" data-go="home">Ir al inicio</button></div></section>`; }
      function gamesPage(){ return `<section class="page-head"><span class="eyebrow">Repaso activo</span><h1>Juegos clínicos</h1><p>Dos formatos ligeros para recuperar conceptos del módulo disponible. No sustituyen el cuestionario de estudio profundo.</p></section><section class="grid games"><article class="game"><span class="eyebrow" style="color:#ffb199">Memorama clínico</span><h2>Empareja concepto y definición</h2><p>Encuentra las parejas antes de que corra el tiempo. Ideal para fijar señales de alerta y patrones clínicos.</p><button class="btn" data-game="memory">Jugar memorama</button></article><article class="game"><span class="eyebrow" style="color:#ffe1ad">Modo ráfaga</span><h2>Responde contra el reloj</h2><p>Tendrás 45 segundos para responder el mayor número posible de preguntas del módulo de adenopatías.</p><button class="btn" data-game="sprint">Iniciar ráfaga</button></article></section>`; }
      const PAIRS=[['Cervical >1 cm','Ganglio aumentado en niño'],['Supraclavicular','Dato de alarma'],['Piel violácea','Sugiere MNT'],['Ecografía','Valora absceso']];
      function memoryPage(){ if(!state.game){ const deck=PAIRS.flatMap(([a,b],i)=>[{t:a,id:i},{t:b,id:i}]).sort(()=>Math.random()-.5); state.game={deck,open:[],matched:[],moves:0,start:Date.now()}; } const g=state.game; return `<section class="page-head"><button class="back" data-go="games">← Juegos</button><span class="eyebrow">Memorama clínico</span><h1>Encuentra las parejas</h1><p>Movimientos: ${g.moves} · <span class="timer" id="memoryTimer">00:00</span></p></section><section class="grid memory">${g.deck.map((c,i)=>{const open=g.open.includes(i)||g.matched.includes(i);return `<button class="memory-card ${open?'open':''} ${g.matched.includes(i)?'matched':''}" data-card="${i}" ${g.matched.includes(i)?'disabled':''}>${open?c.t:'✚'}</button>`}).join('')}</section>`; }
      function clickCard(i){ const g=state.game;if(g.open.length===2||g.open.includes(i)||g.matched.includes(i))return;g.open.push(i);if(g.open.length===2){g.moves++;const [a,b]=g.open;if(g.deck[a].id===g.deck[b].id){g.matched.push(a,b);g.open=[]; if(g.matched.length===g.deck.length){const p=profile();p.stats.memory++;p.xp+=30;touchStudy(p);save(p);setTimeout(()=>{alert('¡Memorama completado!');state.game=null;state.page='games';render()},250);}}else{render();setTimeout(()=>{g.open=[];render()},600);return;}}render(); }
      function sprintPage(){ if(!state.game){ state.game={questions:Q.sort(()=>Math.random()-.5).slice(0,8),index:0,correct:0,end:Date.now()+45000,done:false}; } const g=state.game,q=g.questions[g.index];if(g.done||!q)return sprintResult();return `<section class="quiz-wrap"><div class="sprint-score"><span>Ráfaga clínica</span><span class="timer" id="sprintTimer">00:45</span><span>${g.index+1}/${g.questions.length}</span></div><article class="question"><span class="eyebrow">${q.subtema}</span><h2>${q.pregunta}</h2><div class="options">${q.opciones.map((o,i)=>`<button class="option" data-sprint-answer="${i}"><b>${'ABCD'[i]}</b><span>${o}</span></button>`).join('')}</div></article></section>`; }
      function sprintAnswer(i){const g=state.game,q=g.questions[g.index];if(i===q.correcta)g.correct++;g.index++;if(g.index>=g.questions.length)g.done=true;render();}
      function sprintResult(){const g=state.game,p=profile(),pct=Math.round(g.correct/g.questions.length*100);p.stats.sprint++;p.xp+=g.correct*7;touchStudy(p);save(p);state.game=null;return `<section class="result"><span class="eyebrow">Modo ráfaga completado</span><h1>Tu velocidad clínica</h1><div class="result-score">${pct}%</div><p>${g.correct} respuestas correctas de ${g.questions.length}</p><div class="result-actions"><button class="btn primary" data-game="sprint">Jugar otra vez</button><button class="btn ghost" data-go="games">Volver a juegos</button></div></section>`;}
      async function loadAdminUsers(){ const client=cloudClient(),p=profile();if(!client||p.cloud?.role!=='admin'||state.adminLoading)return;state.adminLoading=true;const {data,error}=await client.rpc('admin_list_users');state.adminLoading=false;state.adminLoaded=true;state.adminError=error?.message||'';state.adminUsers=data||[];render(); }
      async function setAdminUserStatus(id,active){ const client=cloudClient();if(!client)return;const {error}=await client.rpc('admin_set_user_status',{target_user_id:id,next_is_active:active});if(error){state.adminError=error.message;render();return;}await loadAdminUsers(); }
      function adminPage(){const p=profile();if(p.cloud?.role!=='admin')return `<section class="page-head"><button class="back" data-go="home">← Inicio</button><span class="eyebrow">Acceso restringido</span><h1>Administración</h1><p>Esta sección solo está disponible para el superusuario.</p></section>`;const users=state.adminUsers||[];const rows=users.map(u=>`<article class="admin-user ${u.is_active?'':'inactive'}"><div><h3>${esc(u.display_name||'Sin nombre')}</h3><p>${esc(u.email||'Sin correo disponible')}</p><span class="tag">${u.role==='admin'?'Administrador':'Estudiante'} · ${u.is_active?'Activo':'Dado de baja'}</span></div><div class="admin-actions">${u.id===p.cloud.userId?'<span class="tag">Tu cuenta</span>':`<button class="btn ${u.is_active?'ghost':'primary'}" data-admin-user="${u.id}" data-admin-active="${u.is_active?'false':'true'}">${u.is_active?'Dar de baja':'Reactivar'}</button>`}</div></article>`).join('');return `<section class="page-head"><button class="back" data-go="home">← Inicio</button><span class="eyebrow">Superusuario</span><h1>Usuarios</h1><p>Gestiona el acceso a la plataforma. Dar de baja revoca el acceso, pero conserva el historial clínico-académico.</p></section><section class="panel"><div class="section-head" style="margin:0"><div><h3>${users.length} usuario${users.length===1?'':'s'}</h3><p>Solo tú puedes realizar estas acciones.</p></div><button class="btn ghost" id="refreshAdmin">Actualizar</button></div>${state.adminError?`<p class="notice" style="margin-top:14px">${esc(state.adminError)}</p>`:''}<div class="admin-users">${state.adminLoading?'<p style="color:var(--muted)">Cargando usuarios…</p>':rows||'<p style="color:var(--muted)">Aún no hay perfiles creados.</p>'}</div></section>`; }
      function achievementsPage(){const p=profile(),connected=!!p.cloud?.userId,ready=!!cloudClient(),admin=p.cloud?.role==='admin';return `<section class="page-head"><span class="eyebrow">Perfil y avance</span><h1>Logros</h1><p>${connected?'Tu avance se sincroniza de forma privada entre tus dispositivos.':'Tu avance queda en este dispositivo. Puedes seguir estudiando gratis sin cuenta.'}</p></section><section class="panel profile-card"><i class="avatar">${p.avatar}</i><div><h3>${esc(p.name)}</h3><p style="color:var(--muted)">${p.xp} XP · racha máxima de ${p.streak.best} días</p></div></section>${admin?'<section class="panel"><h3>Administración</h3><p style="margin:8px 0 15px;color:var(--muted)">Tienes permisos de superusuario para gestionar accesos.</p><button class="btn primary" data-go="admin">Gestionar usuarios</button></section>':''}<section class="panel"><h3>Sincronización</h3><p style="margin:8px 0 15px;color:var(--muted)">${connected?'Cuenta conectada: '+esc(p.cloud.email||'cuenta personal')+'.':'Modo invitado. '+(ready?'Guarda una copia de tu avance de invitado y entra con una cuenta para sincronizar.':'La conexión con Supabase se habilitará al configurar el proyecto.')}</p>${connected?'<button class="btn ghost" id="signOut">Cerrar sesión en este dispositivo</button>':'<button class="btn primary" id="leaveGuest">Entrar con otra cuenta</button>'}</section><section class="panel"><h3>Cambiar avatar</h3><div class="avatars">${AVATARS.map(a=>`<button class="avatar-choice ${p.avatar===a?'selected':''}" data-change-avatar="${a}">${a}</button>`).join('')}</div></section><div class="section-head"><div><h2>Medallas</h2><p>Se desbloquean según tu actividad de estudio.</p></div></div><section class="grid badges">${BADGES.map(([id,name,desc,icon,check])=>`<article class="badge ${check(p)?'':'lock'}"><span class="medal">${icon}</span><h3>${name}</h3><p>${desc}</p></article>`).join('')}</section><section class="panel" style="margin-top:20px"><h3>Tu información</h3><p style="margin:8px 0 15px;color:var(--muted)">Exporta tu avance si quieres conservarlo o moverlo a otro navegador.</p><button class="btn ghost" id="exportProgress">Exportar progreso JSON</button><button class="btn ghost" id="resetProgress" style="margin-left:8px">Eliminar perfil local</button></section>`; }
      function bind(){ document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;if(state.page==='admin')state.adminLoaded=false;if(state.page==='social')state.socialLoaded=false; if(!['quiz','memory','sprint'].includes(state.page)) state.game=null;render()}); document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;state.page='levels';render()}); document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.level)); document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer)); document.querySelectorAll('[data-learning]').forEach(b=>b.onclick=()=>{state.quiz.learn=b.dataset.learning;render()}); const next=$('#nextQuestion');if(next)next.onclick=nextQuestion; const retry=$('[data-retry]');if(retry)retry.onclick=()=>startQuiz(state.level); document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{state.game=null;state.page=b.dataset.game;render()});document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>clickCard(+b.dataset.card));document.querySelectorAll('[data-sprint-answer]').forEach(b=>b.onclick=()=>sprintAnswer(+b.dataset.sprintAnswer)); document.querySelectorAll('[data-change-avatar]').forEach(b=>b.onclick=()=>{const p=profile();p.avatar=b.dataset.changeAvatar;save(p);render()}); const avatarBtns=document.querySelectorAll('[data-avatar]');avatarBtns.forEach(b=>b.onclick=()=>{avatarBtns.forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}); const start=$('#startBtn');if(start)start.onclick=()=>{const name=$('#nameInput').value.trim()||'Residente';const a=$('[data-avatar].selected').dataset.avatar;save(defaultProfile(name,a));render()}; const install=$('#installBtn');if(install)install.onclick=async()=>{if(!state.deferredPrompt)return;state.deferredPrompt.prompt();await state.deferredPrompt.userChoice;state.deferredPrompt=null;render()}; const exportBtn=$('#exportProgress');if(exportBtn)exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify(profile(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mi-progreso-residencia-pediatrica.json';a.click();URL.revokeObjectURL(a.href)};const reset=$('#resetProgress');if(reset)reset.onclick=()=>{if(confirm('¿Eliminar el perfil y progreso guardados en este navegador?')){localStorage.removeItem(STORE);state={page:'home',topic:null,level:null,quiz:null,game:null,deferredPrompt:state.deferredPrompt};render()}}; setupTimers(); }
      function bindExtras(){ document.querySelectorAll('[data-auth-tab]').forEach(b=>b.onclick=()=>{state.authMode=b.dataset.authTab;render()});const submit=$('#authSubmit');if(submit)submit.onclick=()=>authenticate(state.authMode);const guest=$('#guestBtn');if(guest)guest.onclick=()=>{const avatar=$('[data-avatar].selected')?.dataset.avatar||AVATARS[0];save(defaultProfile('Residente',avatar));render()};const leaveGuest=$('#leaveGuest');if(leaveGuest)leaveGuest.onclick=()=>{const p=profile();if(p&&!p.cloud?.userId)localStorage.setItem(GUEST_BACKUP,JSON.stringify(p));localStorage.removeItem(STORE);state={page:'home',topic:null,level:null,quiz:null,game:null,deferredPrompt:state.deferredPrompt,authMode:'login'};render()};const signOut=$('#signOut');if(signOut)signOut.onclick=async()=>{const p=profile(),client=cloudClient();if(client)await client.auth.signOut();delete p.cloud;localStorage.setItem(STORE,JSON.stringify(p));render()};const refreshAdmin=$('#refreshAdmin');if(refreshAdmin)refreshAdmin.onclick=()=>loadAdminUsers();document.querySelectorAll('[data-admin-user]').forEach(b=>b.onclick=()=>setAdminUserStatus(b.dataset.adminUser,b.dataset.adminActive==='true'));if(state.page==='admin'&&!state.adminLoaded&&!state.adminLoading)loadAdminUsers();document.querySelectorAll('[data-board-topic]').forEach(b=>b.onclick=()=>{state.topic=b.dataset.boardTopic;startQuiz(b.dataset.boardLevel)});if(window.bindSocialExtras)window.bindSocialExtras(); }
      function setupTimers(){ if(state.page==='memory'&&state.game){const el=$('#memoryTimer');const tick=()=>{if(!el||state.page!=='memory')return;const s=Math.floor((Date.now()-state.game.start)/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');requestAnimationFrame(tick)};tick();} if(state.page==='sprint'&&state.game){const el=$('#sprintTimer');const tick=()=>{if(state.page!=='sprint'||!state.game)return;const s=Math.max(0,Math.ceil((state.game.end-Date.now())/1000));if(el)el.textContent='00:'+String(s).padStart(2,'0');if(s===0){state.game.done=true;render();return;}requestAnimationFrame(tick)};tick();} }
      window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.deferredPrompt=e;render()}); if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js')); render();
    </script>
    <script src="social.js"></script>
  </body>
